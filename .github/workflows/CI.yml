name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['1.8', '1.9', '1.10', 'pre']
    uses: ClimFlows/.github/.github/workflows/test.yml@main
    with:
      version: ${{ matrix.version }}
      downgrade_version: '1.10'
    secrets: inherit

  docs:
    permissions:
      actions: write
      contents: write
      statuses: write
    uses: ClimFlows/.github/.github/workflows/docs.yml@main
    with:
      package: ClimFlowsTestCases
    secrets: inherit
